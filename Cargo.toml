[package]
name = "mintaka"
version = "0.3.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
goblin = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
colored = "2"
chrono = "0.4"
walkdir = "2.5.0"
sysinfo = "0.30"
netstat2 = "0.11"
ureq = { version = "2.9", features = ["json"] }
dirs = "5.0"
lazy_static = "1.4"
ratatui = "0.26"
crossterm = "0.27"
dns-lookup = "2.0"
